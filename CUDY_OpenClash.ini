[custom]
; ==========================================
; 🌐 内置独立 DNS 配置（无需开插件 UI 覆写）
; ==========================================
dns_enable=true
dns_ipv6=false
dns_enhanced_mode=fake-ip
dns_respect_rules=false

; 必须为纯 IP，用于直连解析节点域名与 DoH
default_nameserver[]=223.5.5.5
default_nameserver[]=119.29.29.29

; 主 DNS 设置为国内常用纯 IP
nameserver[]=223.5.5.5
nameserver[]=119.29.29.29
nameserver[]=114.114.114.114

; 禁用 fallback 防止国外 DNS 超时阻塞
fallback[] =

; 强制直连/不进行 Fake-IP 映射的域名
fake_ip_filter[] = *.lan
fake_ip_filter[] = *.local
fake_ip_filter[] = mirrors.nd-fs-lucky-3.com

; ==========================================
; 规则集定义（引用的 AI 列表）
; ==========================================
ruleset=🤖 AI,https://raw.githubusercontent.com/gavinkhaos/Rule/main/AI_Rule.list

; 静态兜底规则：没有命中 AI 的流量，走“🐸 手动切换”策略组
ruleset=🐸 手动切换,[]MATCH

; ==========================================
; 策略组定义
; ==========================================
custom_proxy_group=🤖 AI`select`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🐸 手动切换

custom_proxy_group=🐸 手动切换`select`.*
custom_proxy_group=🇯🇵 日本节点`select`(日本)
custom_proxy_group=🇺🇸 美国节点`select`(美国)
custom_proxy_group=🇸🇬 新加坡节点`select`(新加坡)

; 启用自定义规则集
enable_rule_generator=true
overwrite_original_rules=true
